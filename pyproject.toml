[tool.poetry]
package-mode = false

[project]
name = "deep-check"
version = "0.4.1"
description = "DeepCheck — Analisador de Dependências Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.33.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
    "faker>=24.0.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
